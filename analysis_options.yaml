include:
  - package:flutter_lints/flutter.yaml
  - package:bloc_lint/recommended.yaml

analyzer:
  exclude:
    - build/**
    # Written by flutter gen-l10n, which still references the localization
    # delegates Flutter 3.50 deprecated; not ours to change.
    - lib/l10n/app_localizations*.dart
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**

linter:
  rules:
    # avoid_print: false
    # prefer_single_quotes: true
    directives_ordering: true