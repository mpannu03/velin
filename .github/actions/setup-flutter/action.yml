name: Set up Flutter
description: >
  Installs the Flutter version pinned in pubspec.yaml (environment.flutter),
  the Linux desktop build dependencies when on Linux, and the pub packages.
  Shared by every CI and release job so they all build with the same tools.

inputs:
  linux-packages:
    description: Extra apt packages to install on Linux, space separated.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Install Linux build dependencies
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev \
          ${{ inputs.linux-packages }}

    - name: Install Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version-file: pubspec.yaml
        cache: true

    - name: Get packages
      shell: bash
      run: flutter pub get
