name: Publish

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Verify version
        id: version
        shell: pwsh
        run: |
          $pubspecVersion = (Select-String -Path pubspec.yaml -Pattern '^version:\s*(.+)$').Matches.Groups[1].Value.Trim()
          $version = $pubspecVersion.Split('+')[0]

          if ("${{ github.ref_name }}" -ne "v$version") {
            throw "Git tag ${{ github.ref_name }} does not match pubspec version $version"
          }

          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Build Windows
        run: flutter build windows --release

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Create Windows installer
        run: |
          iscc /DAppVersion=${{ steps.version.outputs.version }} packaging/windows/Velin.iss

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: dist/*.exe


  macos-arm64:
    name: macOS ARM64
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable macOS desktop
        run: flutter config --enable-macos-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Verify version
        id: version
        shell: bash
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version:[[:space:]]*//' | cut -d '+' -f1)

          if [ "${GITHUB_REF_NAME}" != "v${VERSION}" ]; then
            echo "Git tag ${GITHUB_REF_NAME} does not match pubspec version ${VERSION}"
            exit 1
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build macOS ARM64
        run: |
          flutter build macos --release

      - name: Create DMG
        run: |
          mkdir -p dist

          hdiutil create \
            -volname "Velin" \
            -srcfolder "build/macos/Build/Products/Release/velin.app" \
            -ov \
            -format UDZO \
            "dist/Velin-${{ steps.version.outputs.version }}-macos-arm64.dmg"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: dist/*.dmg


  macos-x64:
    name: macOS Intel
    runs-on: macos-13

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable macOS desktop
        run: flutter config --enable-macos-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Verify version
        id: version
        shell: bash
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version:[[:space:]]*//' | cut -d '+' -f1)

          if [ "${GITHUB_REF_NAME}" != "v${VERSION}" ]; then
            echo "Git tag ${GITHUB_REF_NAME} does not match pubspec version ${VERSION}"
            exit 1
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build macOS Intel
        run: flutter build macos --release

      - name: Verify architecture
        run: |
          APP="build/macos/Build/Products/Release/velin.app"

          echo "Checking application architecture:"
          file "$APP/Contents/MacOS/velin"

      - name: Create DMG
        run: |
          mkdir -p dist

          hdiutil create \
            -volname "Velin" \
            -srcfolder "build/macos/Build/Products/Release/velin.app" \
            -ov \
            -format UDZO \
            "dist/Velin-${{ steps.version.outputs.version }}-macos-x64.dmg"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-x64
          path: dist/*.dmg


  linux:
    name: Linux x64
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            libgtk-3-dev \
            liblzma-dev \
            imagemagick \
            desktop-file-utils \
            fakeroot

      - name: Install dependencies
        run: flutter pub get

      - name: Verify version
        id: version
        shell: bash
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version:[[:space:]]*//' | cut -d '+' -f1)

          if [ "${GITHUB_REF_NAME}" != "v${VERSION}" ]; then
            echo "Git tag ${GITHUB_REF_NAME} does not match pubspec version ${VERSION}"
            exit 1
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build Linux
        run: flutter build linux --release

      - name: Install AppImage tooling
        run: |
          wget -q \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage \
            -O /tmp/appimagetool

          chmod +x /tmp/appimagetool

      - name: Prepare AppImage
        run: |
          mkdir -p \
            AppDir/usr/bin \
            AppDir/usr/share/applications \
            AppDir/usr/share/icons/hicolor/256x256/apps

          cp -r \
            build/linux/x64/release/bundle/. \
            AppDir/usr/bin/

          cp \
            packaging/linux/velin.desktop \
            AppDir/usr/share/applications/velin.desktop

          cp \
            packaging/linux/velin.desktop \
            AppDir/velin.desktop

          convert \
            assets/icons/icon.png \
            -resize 256x256 \
            AppDir/usr/share/icons/hicolor/256x256/apps/velin.png

          cp \
            AppDir/usr/share/icons/hicolor/256x256/apps/velin.png \
            AppDir/velin.png

          cat > AppDir/AppRun <<'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/bin/velin" "$@"
          EOF

          chmod +x AppDir/AppRun

      - name: Build AppImage
        run: |
          mkdir -p dist

          ARCH=x86_64 /tmp/appimagetool \
            AppDir \
            "dist/Velin-${{ steps.version.outputs.version }}-linux-x86_64.AppImage"

      - name: Prepare DEB
        run: |
          mkdir -p \
            deb/DEBIAN \
            deb/opt/velin \
            deb/usr/bin \
            deb/usr/share/applications \
            deb/usr/share/icons/hicolor/256x256/apps

          cp -r \
            build/linux/x64/release/bundle/. \
            deb/opt/velin/

          cp \
            packaging/linux/velin.desktop \
            deb/usr/share/applications/velin.desktop

          convert \
            assets/icons/icon.png \
            -resize 256x256 \
            deb/usr/share/icons/hicolor/256x256/apps/velin.png

          cat > deb/usr/bin/velin <<'EOF'
          #!/bin/sh
          exec /opt/velin/velin "$@"
          EOF

          chmod +x deb/usr/bin/velin

          cat > deb/DEBIAN/control <<EOF
          Package: velin
          Version: ${{ steps.version.outputs.version }}
          Section: office
          Priority: optional
          Architecture: amd64
          Maintainer: Velin
          Description: PDF reader and toolkit
          EOF

      - name: Build DEB
        run: |
          mkdir -p dist

          dpkg-deb \
            --build \
            deb \
            "dist/Velin-${{ steps.version.outputs.version }}-linux-x86_64.deb"

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: |
            dist/*.AppImage
            dist/*.deb


  release:
    name: Create GitHub Release
    needs:
      - windows
      - macos-arm64
      - macos-x64
      - linux

    runs-on: ubuntu-22.04

    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-x64
          path: dist

      - name: Download macOS ARM64 artifact
        uses: actions/download-artifact@v4
        with:
          name: macos-arm64
          path: dist

      - name: Download macOS Intel artifact
        uses: actions/download-artifact@v4
        with:
          name: macos-x64
          path: dist

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-x64
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Velin ${{ github.ref_name }}
          draft: true
          prerelease: false
          generate_release_notes: true
          files: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb