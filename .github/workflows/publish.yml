name: Publish

# Builds the installers for every platform from a version tag (v1.2.3) and
# attaches them to a draft GitHub release. Run it from a tag: the tag must
# match the version in pubspec.yaml.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  # The same checks as a pull request, so nothing untested is released.
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  version:
    name: Check version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Tag matches pubspec.yaml
        id: version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version:[[:space:]]*//' | cut -d '+' -f1)

          if [ "${GITHUB_REF_NAME}" != "v${VERSION}" ]; then
            echo "::error::Git ref ${GITHUB_REF_NAME} does not match pubspec version ${VERSION}. Run Publish from the tag v${VERSION}."
            exit 1
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

  windows:
    name: Windows x64
    needs: [ci, version]
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: ./.github/actions/setup-flutter

      - name: Build
        run: flutter build windows --release

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Create installer
        run: iscc /DAppVersion=${{ needs.version.outputs.version }} packaging/windows/Velin.iss

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: dist/*.exe

  # One build for all Macs: Flutter builds a universal app (Apple Silicon and
  # Intel). The DMG is named universal only if every binary inside the app,
  # including the bundled native libraries, has both architectures;
  # otherwise it is published for Apple Silicon only.
  macos:
    name: macOS
    needs: [ci, version]
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: ./.github/actions/setup-flutter

      - name: Build
        run: flutter build macos --release

      - name: Check architectures
        id: arch
        run: |
          APP="build/macos/Build/Products/Release/velin.app"
          ARCH=universal

          while IFS= read -r -d '' file; do
            if file "$file" | grep -q 'Mach-O'; then
              archs=$(lipo -archs "$file" 2>/dev/null || echo unknown)
              echo "${archs}  ${file#"$APP"/}"
              case " ${archs} " in
                *" x86_64 "*) ;;
                *) ARCH=arm64 ;;
              esac
            fi
          done < <(find "$APP/Contents" -type f -print0)

          if [ "$ARCH" = arm64 ]; then
            echo "::warning::Some binaries lack x86_64 (see above); publishing for Apple Silicon only."
          fi

          echo "arch=${ARCH}" >> "$GITHUB_OUTPUT"

      - name: Create DMG
        run: |
          mkdir -p dist

          hdiutil create \
            -volname "Velin" \
            -srcfolder "build/macos/Build/Products/Release/velin.app" \
            -ov \
            -format UDZO \
            "dist/Velin-${{ needs.version.outputs.version }}-macos-${{ steps.arch.outputs.arch }}.dmg"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*.dmg

  linux:
    name: Linux x64
    needs: [ci, version]
    # The oldest supported runner, so the AppImage and .deb run on older
    # distributions (glibc is forward compatible only).
    runs-on: ubuntu-22.04

    env:
      VERSION: ${{ needs.version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: ./.github/actions/setup-flutter
        with:
          linux-packages: imagemagick desktop-file-utils fakeroot

      - name: Build
        run: flutter build linux --release

      - name: Install AppImage tooling
        run: |
          wget -q \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage \
            -O /tmp/appimagetool

          chmod +x /tmp/appimagetool

      - name: Prepare AppImage
        run: |
          mkdir -p \
            AppDir/usr/bin \
            AppDir/usr/share/applications \
            AppDir/usr/share/icons/hicolor/256x256/apps

          cp -r build/linux/x64/release/bundle/. AppDir/usr/bin/
          cp packaging/linux/velin.desktop AppDir/usr/share/applications/velin.desktop
          cp packaging/linux/velin.desktop AppDir/velin.desktop

          convert assets/icons/icon.png -resize 256x256 \
            AppDir/usr/share/icons/hicolor/256x256/apps/velin.png
          cp AppDir/usr/share/icons/hicolor/256x256/apps/velin.png AppDir/velin.png

          cat > AppDir/AppRun <<'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/bin/velin" "$@"
          EOF

          chmod +x AppDir/AppRun

      - name: Build AppImage
        run: |
          mkdir -p dist
          ARCH=x86_64 /tmp/appimagetool AppDir "dist/Velin-${VERSION}-linux-x86_64.AppImage"

      - name: Prepare DEB
        run: |
          mkdir -p \
            deb/DEBIAN \
            deb/opt/velin \
            deb/usr/bin \
            deb/usr/share/applications \
            deb/usr/share/icons/hicolor/256x256/apps

          cp -r build/linux/x64/release/bundle/. deb/opt/velin/
          cp packaging/linux/velin.desktop deb/usr/share/applications/velin.desktop

          convert assets/icons/icon.png -resize 256x256 \
            deb/usr/share/icons/hicolor/256x256/apps/velin.png

          cat > deb/usr/bin/velin <<'EOF'
          #!/bin/sh
          exec /opt/velin/velin "$@"
          EOF

          chmod +x deb/usr/bin/velin

          cat > deb/DEBIAN/control <<EOF
          Package: velin
          Version: ${VERSION}
          Section: office
          Priority: optional
          Architecture: amd64
          Maintainer: Velin
          Description: PDF reader and toolkit
          EOF

      - name: Build DEB
        run: |
          mkdir -p dist
          dpkg-deb --build deb "dist/Velin-${VERSION}-linux-x86_64.deb"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: |
            dist/*.AppImage
            dist/*.deb

  release:
    name: Create GitHub release
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Velin ${{ github.ref_name }}
          draft: true
          prerelease: false
          generate_release_notes: true
          files: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
