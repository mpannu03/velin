name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  flutter:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check Formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      # pdfium is not available on the Linux runner; the engine integration
      # tests run in the Windows job below.
      - name: Test
        run: flutter test --exclude-tags pdfium

  # Velin ships on Windows, and the tool engines depend on native pdfium and
  # pdf_manipulator libraries. Run the integration tests against the real
  # binaries on the platform we release for.
  engines-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Engine integration tests
        run: flutter test --tags pdfium

  # Compiles the Linux runner (native C code such as the single-instance and
  # open-files handling in linux/runner) so breakage shows up before release.
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev desktop-file-utils

      - name: Install dependencies
        run: flutter pub get

      - name: Build
        run: flutter build linux --debug

      - name: Validate desktop entry
        run: desktop-file-validate packaging/linux/velin.desktop
