name: CI

# Runs on every pull request to main, and from the Publish workflow before a
# release is built. main itself needs no run of its own: it only changes
# through pull requests, which must be up to date with main and pass here.
on:
  pull_request:
    branches: [main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request replaces the run for the old one.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: ./.github/actions/setup-flutter

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      # Tests that need the native pdfium binaries run per platform below.
      - name: Test
        run: flutter test --exclude-tags pdfium

  # Every platform Velin ships on, on the same runners as the release builds:
  # the app must compile there, and the PDF engines must work against that
  # platform's native libraries. Add Android and iOS here when they ship.
  platform:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            target: windows
          - name: macOS
            os: macos-14
            target: macos
          - name: Linux
            os: ubuntu-22.04
            target: linux

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: ./.github/actions/setup-flutter
        with:
          linux-packages: desktop-file-utils

      - name: Build
        run: flutter build ${{ matrix.target }} --debug

      # Only the engine tests carry the pdfium tag. Pointing flutter test at
      # test/engine keeps it from compiling the whole suite to find them.
      - name: Engine tests against native pdfium
        run: flutter test --tags pdfium test/engine

      - name: Validate desktop entry
        if: matrix.target == 'linux'
        run: desktop-file-validate packaging/linux/velin.desktop
