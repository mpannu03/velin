name: Documentation Issue
description: Report missing or incorrect documentation
title: "[Docs]: "
labels: ["documentation"]

body:
  - type: textarea
    id: problem
    attributes:
      label: Documentation Problem
      description: What part of the documentation is incorrect or missing?
      placeholder: Describe what is incorrect, unclear, or missing.
    validations:
      required: true

  - type: textarea
    id: suggestion
    attributes:
      label: Suggested Improvement
      description: How could the documentation be improved?
      placeholder: Describe your suggested improvement.